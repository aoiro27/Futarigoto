name: Futarigoto
options:
  bundleIdPrefix: com.futarigoto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Futarigoto:
    type: application
    platform: iOS
    sources:
      - path: Futarigoto
        excludes:
          - Info.plist
          - Futarigoto.entitlements
    resources:
      - path: Futarigoto/Assets.xcassets
        type: folder
    info:
      path: Futarigoto/Info.plist
      properties:
        CFBundleDisplayName: ふたりごと
        CFBundleName: ふたりごと
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: jp.yukiusui.futarigoto
            CFBundleURLSchemes:
              - futarigoto
        NSUserNotificationUsageDescription: 週に一度、ふりかえりの時間をお知らせします。
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: jp.yukiusui.futarigoto
      PRODUCT_NAME: ふたりごと
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      INFOPLIST_KEY_CFBundleDisplayName: ふたりごと
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
      DEVELOPMENT_TEAM: "UMS95NYGUN"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Futarigoto/Futarigoto.entitlements
      SWIFT_EMIT_LOC_STRINGS: "YES"
      ENABLE_PREVIEWS: "YES"
    entitlements:
      path: Futarigoto/Futarigoto.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.jp.yukiusui.futarigoto
        com.apple.developer.icloud-services:
          - CloudKit
