name: WagayanoYakusoku
options:
  bundleIdPrefix: com.wagayano
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  WagayanoYakusoku:
    type: application
    platform: iOS
    sources:
      - path: WagayanoYakusoku
        excludes:
          - Info.plist
    resources:
      - path: WagayanoYakusoku/Assets.xcassets
        type: folder
    info:
      path: WagayanoYakusoku/Info.plist
      properties:
        CFBundleDisplayName: わが家の約束
        CFBundleName: わが家の約束
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.wagayano.yakusoku
            CFBundleURLSchemes:
              - wagayano-yakusoku
        NSUserNotificationUsageDescription: 週に一度、ふりかえりの時間をお知らせします。
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wagayano.yakusoku
      PRODUCT_NAME: わが家の約束
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      INFOPLIST_KEY_CFBundleDisplayName: わが家の約束
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      SWIFT_EMIT_LOC_STRINGS: "YES"
      ENABLE_PREVIEWS: "YES"
